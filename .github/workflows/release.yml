name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and test without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# Serialize all releases so an older run cannot race a newer stable promotion.
concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Verify the tag points to reviewed main history
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - name: Validate version and required release notes
        id: validate
        run: node --import tsx scripts/release.ts validate "$RELEASE_TAG"
      - name: Verify stable tap access before publishing anything
        if: steps.validate.outputs.prerelease == 'false' && (github.event_name == 'push' || !inputs.dry-run)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'getditto/homebrew-tap' }}
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$TAP_REPO" --jq .permissions.push)" = true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Build the release package (or restore an already published version)
        env:
          OFFLINE_TOKEN: ${{ secrets.DQL_OFFLINE_LICENSE }}
          DATABASE_ID: ${{ secrets.DITTO_DATABASE_ID }}
        run: node --import tsx scripts/release.ts build "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            build/release/*.tgz
            build/release/SHA256SUMS
            build/release/dittosh.rb
          if-no-files-found: error

  quality:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Integration coverage and end-to-end tests
        env:
          OFFLINE_TOKEN: ${{ secrets.DQL_OFFLINE_LICENSE }}
          DATABASE_ID: ${{ secrets.DITTO_DATABASE_ID }}
        run: |
          test -n "$OFFLINE_TOKEN" && test -n "$DATABASE_ID"
          npm run coverage
          npm run test:e2e

  npm-install:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: build/release
      - name: Install and run offline DQL from the exact npm artifact
        shell: bash
        run: node --import tsx scripts/release-smoke.ts npm "$RELEASE_TAG"

  homebrew-install:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: build/release
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
      - name: Install and test the formula using the unpublished artifact
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: node --import tsx scripts/release-smoke.ts homebrew "$RELEASE_TAG"

  publish:
    needs: [prepare, quality, npm-install, homebrew-install]
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: build/release
      - name: Publish the tested package to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node --import tsx scripts/release.ts npm "$RELEASE_TAG"
      - name: Publish GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/release.ts github "$RELEASE_TAG"

  homebrew:
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment: homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: build/release
      - name: Publish the stable Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'getditto/homebrew-tap' }}
        run: node --import tsx scripts/release.ts homebrew "$RELEASE_TAG"
